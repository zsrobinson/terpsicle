name: Playwright browser
description: Install the selected Playwright browser and its system dependencies.
inputs:
  browser:
    description: chromium, webkit or firefox
    default: chromium
  only-shell:
    description: For chromium, only the headless shell (what headless runs use), not the full browser.
    default: "false"
runs:
  using: composite
  steps:
    - name: Install ${{ inputs.browser }}
      shell: bash
      env:
        BROWSER: ${{ inputs.browser }}
        ONLY_SHELL: ${{ inputs.only-shell }}
      run: |
        if [ "$ONLY_SHELL" = true ]; then
          pnpm exec playwright install --with-deps --only-shell "$BROWSER"
        else
          pnpm exec playwright install --with-deps "$BROWSER"
        fi
