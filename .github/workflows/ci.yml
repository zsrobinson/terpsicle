name: CI

# Validate each PR and the exact merge commit on main. Production deploy
# is a dependent reusable workflow, so no unchecked commit can race CI.
# Browser diagnostics and mobile recordings are explicit workflows.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede PR runs; do not interrupt an active main validation/deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        uses: actions/github-script@v9
        with:
          script: |
            if (context.eventName !== "pull_request") {
              core.setOutput("code", "true");
              return;
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.issue.number,
            });
            // Nothing the app, the tests or the build reads. A rename counts
            // its old path too: moving code into docs/ removes code.
            const docs = /^(docs\/|[^/]+\.md$)/;
            const paths = files.flatMap((f) => [f.filename, f.previous_filename ?? f.filename]);
            // The API lists at most 3000 files; past that, assume code.
            const code = files.length >= 3000 || paths.some((p) => !docs.test(p));
            core.setOutput("code", String(code));
            core.notice(code ? "Code changed: correctness and critical browser checks." : "Docs only: code checks and the preview are skipped.");

  # `pnpm check` is typecheck, lint and unit tests; they run here and in
  # `unit` side by side.
  static:
    name: Typecheck, lint, build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # BUILD §5: the eager bundle for / has a budget, and MapLibre, the
      # generator and the fixtures must stay lazy.
      - name: Bundle budget
        run: pnpm check:bundle

      # What only the production build has (hashed, split chunks and Vite's
      # loader): a page that loses a chunk while starting still starts.
      - uses: ./.github/actions/playwright
        with:
          only-shell: "true"
      - name: e2e against the build
        run: pnpm test:e2e:build

      - name: Route tree is committed and current
        run: git diff --exit-code -- src/routeTree.gen.ts || (echo "::error::src/routeTree.gen.ts is stale. Run pnpm build (or pnpm dev) and commit it." && exit 1)

      - uses: actions/upload-artifact@v7
        with:
          name: worker-build
          path: |
            dist
            .wrangler/deploy/config.json
          include-hidden-files: true
          retention-days: 1

  # Timing benchmarks run on demand, separately from correctness.
  unit:
    name: Unit tests (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: core, with coverage
        if: matrix.shard == 1
        run: pnpm test:coverage
      - name: Every other project, half the files
        run: pnpm vitest run --project ingest --project scripts --project ui --project worker --shard=${{ matrix.shard }}/2

  e2e:
    name: Critical browser journeys
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/playwright
      - uses: ./.github/actions/playwright
        with:
          browser: webkit
      - name: Desktop journeys and phone smoke on Chromium and WebKit
        run: pnpm test:e2e:ci
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  check:
    # Branch protection requires this name: keep it.
    name: Check, build, e2e
    needs: [changes, static, unit, e2e, preview]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
          PREVIEW: ${{ needs.preview.result }}
          EXPECT_PREVIEW: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          echo "Changed paths: $CHANGES (code: $CODE)"
          echo "Typecheck, lint, build: $STATIC"
          echo "Unit tests: $UNIT"
          echo "e2e: $E2E"
          echo "Preview: $PREVIEW"
          [ "$CHANGES" = success ] || exit 1
          if [ "$CODE" = false ]; then
            [ "$STATIC" = skipped ] && [ "$UNIT" = skipped ] &&
              [ "$E2E" = skipped ] && [ "$PREVIEW" = skipped ]
          else
            [ "$STATIC" = success ] && [ "$UNIT" = success ] &&
              [ "$E2E" = success ] || exit 1
            if [ "$EXPECT_PREVIEW" = true ]; then
              [ "$PREVIEW" = success ]
            else
              [ "$PREVIEW" = skipped ]
            fi
          fi

  preview:
    name: Preview deploy
    # Not after e2e: a preview is its own Worker, and waiting for e2e only
    # made the preview later. It does wait for the unit tests (the worker
    # project applies every migration) before migrating the shared previews
    # database.
    needs: [changes, static, unit]
    # Secrets aren't available to forks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: worker-build

      # Previews share one D1 database (terpsicle-preview); bring it up to
      # this PR's migrations before its code runs against it.
      - name: Apply D1 migrations to the previews database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply terpsicle-preview --remote -c wrangler.preview-d1.jsonc

      - name: Upload Worker preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          # Wrangler logs the redirected-config notice to stdout before the
          # JSON, so keep only the JSON document.
          output="$(pnpm exec wrangler preview --name "$PREVIEW_NAME" --json | sed -n '/^{/,$p')"
          url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "Preview: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke-check the preview
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: |
          # The marketing page, the scheduler, and the privacy page Google's
          # sign-in consent screen links to.
          base="${URL%/}"
          for i in 1 2 3 4 5; do
            curl -fsS -o /dev/null "$base/" &&
              curl -fsS -o /dev/null "$base/schedule" &&
              curl -fsS -o /dev/null "$base/privacy" && exit 0
            sleep 5
          done
          echo "::error::Preview at $URL didn't answer 200 for /, /schedule and /privacy"
          exit 1

      # The preview reads production R2: real courses must load and cache.
      - uses: ./.github/actions/playwright
        with:
          only-shell: "true"

      - name: Real data on the preview (Playwright)
        env:
          LIVE_URL: ${{ steps.preview.outputs.url }}
        run: pnpm test:e2e:live

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: preview-smoke
          path: |
            playwright-report
            test-results
          retention-days: 7

      - name: Comment the preview URL
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = "<!-- terpsicle-preview -->";
            const body = `${marker}\n**Preview:** ${process.env.URL} (the scheduler: ${process.env.URL.replace(/\/+$/, "")}/schedule)\n\nBuilt from ${context.payload.pull_request.head.sha.slice(0, 7)}. Crons don't run on previews; /data reads production R2.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  deploy:
    name: Production
    needs: [check, changes]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
