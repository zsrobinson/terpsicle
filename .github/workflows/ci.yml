name: CI

# Once per commit: a PR's commits run as `pull_request` (which also gets the
# preview deploy), and main's as `push`. Branch pushes without a PR aren't
# checked; open a PR (a draft is fine) or run it by hand (workflow_dispatch).
# Listening to every branch push as well ran each PR commit twice. Deploy
# (deploy.yml) runs check and build on main but not the bundle budget or
# e2e, so main keeps its own run here.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A new commit on a PR supersedes the last; every main commit gets a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Check, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Typecheck, lint, unit tests
        run: pnpm check

      - name: Build
        run: pnpm build

      # BUILD §5: the eager bundle for / has a budget, and MapLibre, the
      # generator and the fixtures must stay lazy.
      - name: Bundle budget
        run: pnpm check:bundle

      - name: Route tree is committed and current
        run: git diff --exit-code -- src/routeTree.gen.ts || (echo "::error::src/routeTree.gen.ts is stale. Run pnpm build (or pnpm dev) and commit it." && exit 1)

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: e2e (against pnpm dev:mock)
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  preview:
    name: Preview deploy
    needs: check
    # Secrets aren't available to forks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    outputs:
      url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build

      # Previews share one D1 database (terpsicle-preview); bring it up to
      # this PR's migrations before its code runs against it.
      - name: Apply D1 migrations to the previews database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply terpsicle-preview --remote -c wrangler.preview-d1.jsonc

      - name: Upload Worker preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
        run: |
          set -o pipefail
          # Wrangler logs the redirected-config notice to stdout before the
          # JSON, so keep only the JSON document.
          output="$(pnpm exec wrangler preview --name "$PREVIEW_NAME" --json | sed -n '/^{/,$p')"
          url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "Preview: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke-check the preview
        env:
          URL: ${{ steps.preview.outputs.url }}
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS -o /dev/null "$URL" && exit 0
            sleep 5
          done
          echo "::error::Preview at $URL didn't answer 200"
          exit 1

      # The preview reads production R2: real courses must load and cache.
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Real data on the preview (Playwright)
        env:
          LIVE_URL: ${{ steps.preview.outputs.url }}
        run: pnpm test:e2e:live

      - name: Comment the preview URL
        uses: actions/github-script@v9
        env:
          URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = "<!-- terpsicle-preview -->";
            const body = `${marker}\n**Preview:** ${process.env.URL}\n\nBuilt from ${context.payload.pull_request.head.sha.slice(0, 7)}. Crons don't run on previews; /data reads production R2.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Phone behavior on real engines (docs/MOBILE-TESTING.md), for PRs that
  # touch the app shell, the styles or the lab itself: WebKit with an
  # iPhone's viewport on every such PR; the `mobile-lab` label adds the
  # Android emulator and the iOS Simulator.
  mobile-changes:
    name: Mobile paths changed?
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      touched: ${{ steps.files.outputs.result }}
    steps:
      - id: files
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.issue.number,
            });
            const mobile = /^(src\/app\/|src\/styles\.css$|scripts\/mobile-lab\/|\.github\/workflows\/mobile-lab\.yml$)|drawer/;
            return String(files.some((f) => mobile.test(f.filename)));

  mobile-lab:
    name: Mobile lab
    needs: [preview, mobile-changes]
    if: needs.mobile-changes.outputs.touched == 'true' || contains(github.event.pull_request.labels.*.name, 'mobile-lab')
    permissions:
      contents: write
    uses: ./.github/workflows/mobile-lab.yml
    with:
      url: ${{ needs.preview.outputs.url }}
      engines: ${{ contains(github.event.pull_request.labels.*.name, 'mobile-lab') && 'webkit,android,ios' || 'webkit' }}
