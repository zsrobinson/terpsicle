name: Deploy

on:
  workflow_call:

# Deploys run in order; never cancel one halfway through migrations.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to terpsicle.com
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://terpsicle.com
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy only the current main commit
        id: current
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Main advanced; its own validated run will deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: ./.github/actions/setup
        if: steps.current.outputs.deploy == 'true'

      - uses: actions/download-artifact@v8
        if: steps.current.outputs.deploy == 'true'
        with:
          name: worker-build

      # Synced data can't be read or written without this secret
      # (docs/DATA.md §7.7), so stop before the migrations and the deploy
      # when it isn't set. `secret list` gives names and types, never values.
      - name: Check the USER_DATA_KEY secret is set
        if: steps.current.outputs.deploy == 'true'
        run: |
          names=$(pnpm exec wrangler secret list --format json)
          if ! printf '%s' "$names" | grep -Eq '"name": *"USER_DATA_KEY"'; then
            echo "::error::Set the Worker secret USER_DATA_KEY before deploying (docs/DATA.md §7.7)."
            exit 1
          fi

      # Account keys live in this bucket (docs/DATA.md §7.7): stop before the
      # migrations, with a clear message, when it hasn't been made yet.
      - name: Check the USER_KEYS bucket exists
        if: steps.current.outputs.deploy == 'true'
        run: |
          if ! pnpm exec wrangler r2 bucket info terpsicle-user-keys > /dev/null; then
            echo "::error::Create the private R2 bucket terpsicle-user-keys before deploying (docs/DATA.md §7.7)."
            exit 1
          fi

      # Production. The previews database is migrated by ci.yml's preview job
      # (wrangler.preview-d1.jsonc).
      - name: Apply D1 migrations
        if: steps.current.outputs.deploy == 'true'
        run: pnpm exec wrangler d1 migrations apply terpsicle --remote

      - name: Deploy Worker
        if: steps.current.outputs.deploy == 'true'
        run: pnpm exec wrangler deploy

      - uses: ./.github/actions/playwright
        if: steps.current.outputs.deploy == 'true'
        with:
          only-shell: "true"
      - name: Read-only browser smoke on production
        if: steps.current.outputs.deploy == 'true'
        env:
          LIVE_URL: https://terpsicle.com
        run: pnpm test:e2e:live
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: production-smoke
          path: |
            playwright-report
            test-results
          retention-days: 7
