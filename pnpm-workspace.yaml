# Single package; this file only carries pnpm settings.
# pnpm blocks dependency build scripts unless they're listed here. The allowed
# ones are native binaries for the linter, bundler, CSS engine and the local
# Workers runtime; core-js only prints a donation banner.
allowBuilds:
  "@biomejs/biome": true
  core-js: false
  esbuild: true
  lightningcss: true
  sharp: true
  workerd: true
# vaul never passes `modal` to Radix Dialog, so even `modal={false}` hides the
# rest of the page from screen readers and traps focus in the drawer. The
# phone drawer is always open next to the calendar, so it must not be modal.
patchedDependencies:
  vaul@1.1.2: patches/vaul@1.1.2.patch
